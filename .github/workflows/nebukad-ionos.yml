name: Publish selected Nebukad website files

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Explicit files relative to nebukad/; no deletion or full-site mirror'
        required: true
        default: light-legacy-privacy.html
        type: string

permissions:
  contents: read

concurrency:
  group: nebukad-ionos-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nebukad-ionos-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transfer library
        run: python -m pip install 'paramiko>=3.5,<5'
      - name: Verify connection and back up selected public files
        env:
          IONOS_CONNECTION_JSON: ${{ secrets.IONOS_CONNECTION_JSON }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DEPLOY_FILES: ${{ inputs.files }}
        run: python scripts/publish-selected-static.py backup
      - name: Preserve backup before changing the website
        uses: actions/upload-artifact@v4
        with:
          name: nebukad-selected-public-backup-${{ github.run_id }}
          path: deployment-backup/
          if-no-files-found: error
          retention-days: 30
      - name: Publish selected files and verify their public bytes
        env:
          IONOS_CONNECTION_JSON: ${{ secrets.IONOS_CONNECTION_JSON }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DEPLOY_FILES: ${{ inputs.files }}
        run: python scripts/publish-selected-static.py publish
